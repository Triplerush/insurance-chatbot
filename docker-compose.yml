services:
  # ─── Backend FastAPI + LangGraph agent ─────────────────────────
  # Escucha interno en :8000. Accesible desde el frontend Streamlit
  # (red default) y desde insurance_proxy (portfolio-net) bajo
  # /insurance/api/* (NPM lo enruta vía portfolio-net).
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    image: ${BACKEND_IMAGE:-ghcr.io/triplerush/insurance_backend:latest}
    container_name: insurance_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - default

  # ─── Frontend Streamlit ────────────────────────────────────────
  # Streamlit detras de NPM usando subpath /insurance/.
  # baseUrlPath asegura que los assets y websockets se sirven en
  # esa ruta. enableXsrfProtection=false porque el origen no
  # coincide con la URL externa.
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    image: ${FRONTEND_IMAGE:-ghcr.io/triplerush/insurance_frontend:latest}
    container_name: insurance_frontend
    restart: unless-stopped
    env_file:
      - .env
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.baseUrlPath=/insurance
      - --server.enableCORS=false
      - --server.enableXsrfProtection=false
    depends_on:
      - backend
    networks:
      - default

  # ─── OpenSearch (BM25 + dense vectors) ─────────────────────────
  # Heap reducido a 512MB para encajar en el VPS de 4GB compartido
  # con core, auto-profiling y otros sub-proyectos. Suficiente
  # para el corpus de 22 polizas de seguros.
  # No expone puertos al host: solo accesible por la red default.
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.12.0}
    container_name: insurance_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - os-data:/usr/share/opensearch/data
    networks:
      - default

  # ─── Pipeline de ingesta (efimero) ─────────────────────────────
  # Profile "ingest": NO se levanta con `docker compose up -d`.
  # Se ejecuta con: docker compose --profile ingest run --rm tasks
  # El CI lo invoca tras el up para descargar PDFs publicos,
  # crear indices y generar embeddings.
  tasks:
    build:
      context: ./data
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    image: ${TASKS_IMAGE:-ghcr.io/triplerush/insurance_tasks:latest}
    container_name: insurance_tasks
    profiles: ["ingest"]
    env_file:
      - .env
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./data/raw_policies:/app/data/raw_policies
      - ./eda_out:/app/eda_out
      - ./data/test/ragas_eval/results:/app/results
      - hf-cache:/root/.cache/huggingface
    networks:
      - default

  # ─── Proxy interno del sub-proyecto ────────────────────────────
  # Agrupa frontend + backend bajo el subpath /insurance/.
  # NPM (en el Droplet) reenvia triplerush.tech/insurance/* a
  # insurance_proxy:3081 usando la red compartida portfolio-net.
  # No expone puertos al host: NPM lo alcanza via portfolio-net.
  nginx-proxy:
    image: nginx:alpine
    container_name: insurance_proxy
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - default
      - portfolio-net

volumes:
  os-data:
  hf-cache:

networks:
  portfolio-net:
    external: true
