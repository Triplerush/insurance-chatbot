upstream insurance_backend {
    server insurance_backend:8000;
}

upstream insurance_frontend {
    server insurance_frontend:8501;
}

# Mapa para soporte de WebSocket de Streamlit
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3081;
    server_name _;

    # Tamanos y timeouts (carga de PDFs / streaming SSE)
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ─── Backend FastAPI bajo /api/* ──────────────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://insurance_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Frontend Streamlit ───────────────────────────────
    location / {
        proxy_pass http://insurance_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
