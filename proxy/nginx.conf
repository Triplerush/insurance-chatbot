upstream insurance_backend {
    server insurance_backend:8000;
}

upstream insurance_frontend {
    server insurance_frontend:8501;
}

# Mapa para soporte de WebSocket de Streamlit
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3081;
    server_name _;

    # Tamanos y timeouts (carga de PDFs / streaming SSE)
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ─── Backend FastAPI bajo /insurance/api/* ─────────────────
    # Reescribe la ruta para que el backend reciba paths sin prefix.
    # Ej: /insurance/api/chat -> /chat dentro del contenedor.
    location /insurance/api/ {
        rewrite ^/insurance/api/(.*) /$1 break;
        proxy_pass http://insurance_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Frontend Streamlit bajo /insurance/ ───────────────────
    # Streamlit ya esta configurado con --server.baseUrlPath=/insurance
    # asi que NO se reescribe la ruta: el contenedor recibe /insurance/*
    # tal cual y sirve sus assets y websockets coherentes.
    location /insurance/ {
        proxy_pass http://insurance_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirige /insurance (sin slash) a /insurance/ para que Streamlit
    # cargue correctamente los assets relativos.
    location = /insurance {
        return 301 /insurance/;
    }
}
